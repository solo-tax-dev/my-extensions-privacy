<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopScope — Quick Feedback</title>
<style>
  :root {
    --bg: #12151B;
    --accent: #F2A03D;
    --text: #F5F5F5;
    --muted: #9AA0AC;
    --card-bg: #1B1F27;
    --border: #2A2F3A;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }

  h1 {
    font-size: 22px;
    line-height: 1.3;
    margin: 0 0 8px;
    color: var(--text);
  }

  .subtext {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }

  .reasons {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .reason-btn {
    width: 100%;
    padding: 16px 18px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    background: #22273159 ;
    background-color: #232838;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
  }

  .reason-btn:hover {
    border-color: var(--accent);
    background-color: #2A2F3F;
  }

  .reason-btn:active {
    transform: scale(0.98);
  }

  .reason-btn:disabled {
    opacity: 0.6;
    cursor: default;
    transform: none;
  }

  .extra {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    text-align: left;
  }

  .extra label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    background: #0F1218;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 12px;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .send-btn {
    margin-top: 12px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    color: #12151B;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .send-btn:hover {
    opacity: 0.9;
  }

  .send-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .thanks {
    font-size: 18px;
    padding: 24px 0;
  }

  .note-status {
    font-size: 13px;
    color: var(--muted);
    margin-top: 10px;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Sorry to see you go — mind telling me why?</h1>
    <p class="subtext">Takes 5 seconds, genuinely helps me improve ShopScope.</p>

    <div id="reasons-section">
      <div class="reasons" id="reasons">
        <button class="reason-btn" data-reason="Didn't work as expected">Didn't work as expected</button>
        <button class="reason-btn" data-reason="Missing a feature I needed">Missing a feature I needed</button>
        <button class="reason-btn" data-reason="Found a better tool">Found a better tool</button>
        <button class="reason-btn" data-reason="Just not using it anymore">Just not using it anymore</button>
        <button class="reason-btn" data-reason="Other">Other</button>
      </div>

      <div class="extra">
        <label for="note">Anything else you want to add? (optional)</label>
        <textarea id="note" placeholder="Type here..."></textarea>
        <br>
        <button class="send-btn" id="send-note">Send</button>
        <div class="note-status" id="note-status"></div>
      </div>
    </div>

    <div id="thanks" class="thanks" style="display:none;">Thanks — really appreciate it 🙏</div>
  </div>

<script>
  const FORMSPREE_ENDPOINT = "https://formspree.io/f/xaqrzzpe";

  const reasonsSection = document.getElementById('reasons-section');
  const thanksEl = document.getElementById('thanks');
  const reasonButtons = document.querySelectorAll('.reason-btn');
  const noteEl = document.getElementById('note');
  const sendNoteBtn = document.getElementById('send-note');
  const noteStatus = document.getElementById('note-status');

  function showThanks() {
    reasonsSection.style.display = 'none';
    thanksEl.style.display = 'block';
  }

  async function submitToFormspree(payload) {
    return fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  }

  reasonButtons.forEach((btn) => {
    btn.addEventListener('click', async () => {
      reasonButtons.forEach((b) => (b.disabled = true));
      const reason = btn.getAttribute('data-reason');
      try {
        await submitToFormspree({ reason: reason });
      } catch (err) {
        // Fail silently for the user; nothing else we can do client-side.
      }
      showThanks();
    });
  });

  sendNoteBtn.addEventListener('click', async () => {
    const message = noteEl.value.trim();
    if (!message) {
      noteStatus.textContent = 'Add a note first, or just pick a reason above.';
      return;
    }
    sendNoteBtn.disabled = true;
    noteStatus.textContent = 'Sending...';
    try {
      await submitToFormspree({ message: message });
      noteStatus.textContent = 'Sent — thank you!';
      noteEl.value = '';
    } catch (err) {
      noteStatus.textContent = 'Something went wrong. Please try again.';
      sendNoteBtn.disabled = false;
    }
  });
</script>

</body>
</html>
